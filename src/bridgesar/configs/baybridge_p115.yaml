# Bay Bridge (San Francisco-Oakland), Sentinel-1 P115 descending.
# This is the config used by the example notebook.
bridge_name: Bay Bridge
track: P115

# streaming ROI (WGS84 degrees)
lat_min: 37.785
lat_max: 37.81
lon_min: -122.392
lon_max: -122.36

# deck geometry
deck_height_m: 62.0
bridge_thickness_m: 9.0
scatter_model: mixed

# local temporal-averaging window for the per-date D+T fit
k_before: 1
k_after: 1

# outlier filtering
contrast_min_threshold: 1.30
h_mean_mad_k: 3.0
mask_towers: false

# NOAA reference matching
wl_avg_halfwin_hours: 3.0
wl_primary_id: '9414290'
airgap_station: '9414304'        # on-bridge NOAA air-gap sensor (Alameda)
wl_stations:
  - {id: '9414290', name: 'San Francisco, CA', datum: MLLW}
  - {id: '9414863', name: 'Richmond, CA',      datum: MLLW}

# OpenStreetMap bridge geometry
osm:
  names: ['Bay Bridge']
  refs: ['I 80']
  bbox: [37.78, -122.40, 37.83, -122.30]   # S, W, N, E
  utm_epsg: 32610
  name_regex: 'San Francisco.{0,3}Oakland.*Bay Bridge'
