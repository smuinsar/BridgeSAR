[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgesar"
version = "0.1.0"
description = "Geometry-guided estimation of bridge-water clearance from SAR multipath scattering stripes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jinwoo Kim" },
]
keywords = ["SAR", "Sentinel-1", "OPERA", "CSLC", "bridge", "clearance", "InSAR", "remote sensing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "rasterio>=1.3",
    "zarr>=2.13",
    "xarray>=2023.1",
    "dask>=2023.1",
    "geopandas>=0.12",
    "shapely>=2.0",
    "pyproj>=3.4",
    "h5py>=3.7",
    "fsspec>=2023.1",
    "requests>=2.28",
    "earthaccess>=0.9",
    "joblib>=1.2",
    "rioxarray>=0.13",
    "PyYAML>=6.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]
notebook = ["jupyter", "ipykernel"]

[project.urls]
Homepage = "https://github.com/smuinsar/BridgeSAR"
Repository = "https://github.com/smuinsar/BridgeSAR"
Issues = "https://github.com/smuinsar/BridgeSAR/issues"

[project.scripts]
bridgesar-stream = "bridgesar.cli:stream_main"
bridgesar-osm = "bridgesar.cli:osm_main"
bridgesar-timeseries = "bridgesar.cli:timeseries_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bridgesar.configs" = ["*.yaml"]
